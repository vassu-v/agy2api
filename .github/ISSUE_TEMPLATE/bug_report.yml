name: Bug Report
description: Report an issue or bug encountered in AGY2API
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for your feedback!
        Please fill out the details below to help us diagnose and resolve the issue quickly.
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have read the project documentation.
          required: true
  
  - type: dropdown
    id: latest-version
    attributes:
      label: Version Check
      description: Are you running the latest version of AGY2API?
      options:
        - Yes, running the latest version
        - No, running an older version
    validations:
      required: true
  
  - type: input
    id: model
    attributes:
      label: Model Used
      description: E.g., gemini-2.5-flash, claude-sonnet-4-5
      placeholder: "e.g. gemini-2.5-flash"
    validations:
      required: true
  
  - type: dropdown
    id: format
    attributes:
      label: API Format
      description: Select the API format being called
      options:
        - OpenAI format (/v1/chat/completions)
        - Gemini format (/v1/models/...:generateContent)
        - Claude format (/v1/messages)
        - Other / Unknown
    validations:
      required: true
  
  - type: textarea
    id: error-content
    attributes:
      label: Error Details / Logs
      description: Paste full error logs, tracebacks, or output
      placeholder: |
        Paste complete error log or stack trace here
      render: shell
    validations:
      required: true
  
  - type: textarea
    id: error-description
    attributes:
      label: Problem Description
      description: Describe what you were doing, expected behavior, and actual outcome
      placeholder: |
        1. Steps to reproduce
        2. Expected behavior
        3. Actual behavior
    validations:
      required: true
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context (Optional)
      description: OS, Python version, environment details, or relevant configuration
      placeholder: "e.g. Linux Ubuntu 22.04, Python 3.12, Docker mode"
