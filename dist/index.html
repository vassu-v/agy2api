    <script>
      // When reverse proxy mounts the panel under a subpath, the URL might lack a trailing slash (e.g. /AGY2API).
      // Relative path resources would resolve to the root domain; append slash to ensure assets load from subpath.
      // Must be placed before module script so inline script executes and redirects before module script loads.
      if (!location.pathname.endsWith("/")) {
        location.replace(
          location.pathname + "/" + location.search + location.hash
        );
      }
    </script>
