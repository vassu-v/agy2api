version: '3.8'

services:
  agy2api:
    image: ghcr.io/vassu-v/agy2api:latest
    container_name: agy2api
    restart: unless-stopped
    network_mode: host
    environment:
      # Password configuration (separated passwords)
      - API_PASSWORD=${API_PASSWORD:-your_api_password}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-your_panel_password}

      # Server configuration
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}

      # Optional: PostgreSQL configuration (distributed storage)
      # - POSTGRESQL_URI=${POSTGRESQL_URI}

      # Optional: Proxy configuration
      # - PROXY=${PROXY}
    volumes:
      - ./data/creds:/app/creds
      - ./data/request_logs:/app/data/request_logs
